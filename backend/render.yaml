services:
  - type: web
    name: achadinhos-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: MONGODB_URI
        sync: false          # preencher manualmente no painel do Render
      - key: SECRET_KEY
        generateValue: true  # gerado automaticamente pelo Render
      - key: CORS_ORIGINS
        value: https://achadinhos-frontend.vercel.app  # atualizar com URL real do Vercel
      - key: SHOPEE_PARTNER_ID
        sync: false
      - key: SHOPEE_PARTNER_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # token do bot do Telegram (@BotFather)
      - key: TELEGRAM_CHAT_ID
        sync: false          # ID do canal/grupo do Telegram
      - key: ZAPI_INSTANCE_ID
        sync: false          # ID da instância Z-API
      - key: ZAPI_TOKEN
        sync: false          # Token da instância Z-API
      - key: ZAPI_CLIENT_TOKEN
        sync: false          # Client-Token de segurança (painel Z-API, opcional)
      - key: ZAPI_PHONE
        sync: false          # Número ou ID do grupo WhatsApp (ex: 120363xxxxxxxxxx-group@g.us)
      - key: SITE_URL
        value: https://achadinhos-frontend.vercel.app  # URL pública do site
